# Alembic configuration for Calorithm.
# The DATABASE_URL is supplied at runtime via `sqlalchemy.url` (set by the
# app's startup code or overridden in tests via AlembicConfig.set_main_option).

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template for new revision file names.
file_template = %%(rev)s_%%(slug)s

# Timezone used when writing "Generates" timestamps.
timezone = UTC

# Truncate revision IDs in file names to this many characters.
truncate_slug_length = 40

# Target revision for `alembic upgrade` when no revision is specified.
# Leave blank — callers always pass an explicit target.
# sqlalchemy.url is intentionally left empty here: it must be supplied at
# runtime (from Settings.DATABASE_URL or overridden in tests).  Leaving it
# blank ensures nobody accidentally runs migrations against a wrong DB.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
